# This is a Declarative Automation Bundle definition for porygon_bundle_test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: porygon_bundle_test
  uuid: e7f9669d-64b3-42c8-8c72-17145a436891

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: "bundle_test"
  schema:
    description: The schema to use
    default: "default"
  landing_zone:
    description: "Cloud storage landing zone URI containing raw files"
    default: "s3://porygon-landing-zone/"
  bronze_path:
    description: "S3 path where the bronze Delta table is written"
    default: "s3://porygon-bronze/"
  export_path:
    description: "S3 path where bronze_events is exported for sharing"
    default: "s3://porygon-shared-exports"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7350f2a1-4fb7.cloud.databricks.com
    variables:
      catalog: bundle_test
      schema: ${workspace.current_user.short_name}
      bronze_path: s3://porygon-bronze/dev
      export_path: s3://porygon-shared-exports/dev
  prod:
    mode: production
    workspace:
      host: https://dbc-7350f2a1-4fb7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/anamargaritapreciado@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anamargaritapreciado@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bundle_test
      schema: prod
      bronze_path: s3://porygon-bronze/prod
      export_path: s3://porygon-shared-exports/prod
    permissions:
      - user_name: anamargaritapreciado@gmail.com
        level: CAN_MANAGE
      # The CI/CD service principal used by GitHub Actions (Application ID, not a secret)
      - service_principal_name: fac0c18d-0db4-47f4-a020-99739bf422c7
        level: CAN_MANAGE
